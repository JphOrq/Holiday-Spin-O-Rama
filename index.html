<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Holiday Spin-O-Rama</title>
    <link rel="stylesheet" href="holiday_spinorama_styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>"
    />
  </head>

  <body>
    <div class="app" id="app">
      <div class="snow"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="sticker s1">🎅</div>
      <div class="sticker s2">🎁</div>
      <div class="sticker s3">⛄</div>
      <div class="sticker s4">🦌</div>

      <header>
        <div class="logo">🎄 SPIN-O-RAMA 🎉</div>
        <div class="controls">
          <button class="small-btn" id="themeBtn">🎆 New Year Mode</button>
          <button class="small-btn" id="soundBtn">🔊 Sound On</button>
        </div>
      </header>

      <section class="hero">
        <h1 id="title">Spin into Christmas Chaos!</h1>
        <p id="subtitle">
          One click. One ridiculous prize. Absolutely no elves were consulted.
        </p>
      </section>

      <main class="game">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <div class="wheel" id="wheel">
            <div class="labels" id="labels"></div>
          </div>
          <div class="hub">🎁</div>
        </div>

        <aside class="panel">
          <h2 id="panelTitle">🎁 What will you get?</h2>
          <div class="result" id="result">SPIN ME!</div>
          <button class="spin-btn" id="spin">🎄 SPIN THE WHEEL 🎄</button>
          <!-- <div class="note">
            Tip: replace the prize text, emojis, colors, and sounds in the
            CONFIG object at the bottom.
          </div> -->
          <div class="history" id="history"></div>
        </aside>

        <footer class="main-footer">
          <p>
            JphOrq
            <a href="https://github.com/JphOrq" target="_blank">
              <img
                src="imagesRunning/GitHub1.png"
                alt="GitHub"
                width="24"
                height="24"
              />
            </a>
            <br />
            &copy; 2026-<span id="currentYear"></span>
          </p>
        </footer>
      </main>
    </div>
    <div class="confetti" id="confetti"></div>

    <script src="holiday_spinorama_script.js"></script>
  </body>
</html>
